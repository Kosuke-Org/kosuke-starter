name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Kosuke's app runners in every private repository made from this one:
    # One Shot repositories use no GitHub-hosted minutes. GitHub's runners only
    # in a public repository (this template), where they cost nothing and a
    # self-hosted runner would run any fork's pull request.
    runs-on: ${{ github.event.repository.private && 'kosuke-apps-2' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
